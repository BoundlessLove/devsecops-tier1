name: CI – React + Node

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Upload server test report
        uses: actions/upload-artifact@v4
        with:
          name: test-report-server
          path: server/test-report.html

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 🔐 Login to Azure
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}          
          #client-id: ${{ secrets.AZURE_CLIENT_ID }}
          #tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          #client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          #subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 🔐 Fetch secrets from Key Vault
      - name: Fetch secrets from Azure Key Vault
        id: keyvault
        uses: azure/get-keyvault-secrets@v1
        with:
          keyvault: ${{ secrets.AZURE_KEYVAULT_NAME }}
          secrets: |
            apikey

      # 🔧 Pass secret to React client
      - name: Set client env by exporting API KEY
        run:  echo "APIKEY=${{ steps.keyvault.outputs.apikey }}" >> $GITHUB_ENV

      - name: Debug APIKEY
        run: |
          echo "APIKEY raw: '${{ steps.keyvault.outputs.apikey }}'"
          echo "APIKEY is: '${{ env.APIKEY }}'"


      # Install and start backend with secret
      - name: Install backend
        working-directory: server
        run: npm ci

      - name: Start backend
        working-directory: server
        run: |
          API_KEY="${{ env.APIKEY }}" npm start &
          echo $! > backend.pid

      - name: Wait for backend
        run: npx wait-on http://localhost:5000/api/hello

      # Run frontend tests
      - name: Install frontend
        working-directory: client
        run: npm ci

      # Inject vars into .env.test
      - name: Inject API key into test environment
        working-directory: client
        run: |
          echo "REACT_APP_API_KEY=${{ env.APIKEY }}" >> .env.test
          echo "REACT_APP_API_URL=http://localhost:5000" >> .env.test
      
      # Debug (optional but VERY helpful)
      - name: Show .env.test
        working-directory: client
        run: |
          cat .env.test


      # run tests
      - name: Run client tests
        working-directory: client
        run: |
          CI=true npm test -- --watchAll=false --runInBand

      # Stop backend
      - name: Stop backend
        working-directory: server
        run: |
          kill $(cat backend.pid) || true

      - name: Build frontend
        run: npm run build
