name: CI – React + Node

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Upload server test report
        uses: actions/upload-artifact@v4
        with:
          name: test-report-server
          path: server/test-report.html

  
  frontend:
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install and start backend
      - name: Install backend
        working-directory: server
        run: npm ci

      - name: Start backend
        working-directory: server
        run: |
          npm start &
          echo $! > backend.pid

      - name: Wait for backend health
        run: npx wait-on http://localhost:5000/api/hello

      # Now run frontend tests
      - name: Install frontend
        run: npm ci

      - name: Run frontend tests
        run: npm test

      # Stop backend cleanly
      - name: Stop backend
        working-directory: server
        run: |
          if [ -f backend.pid ]; then
            kill $(cat backend.pid)
            echo "Backend stopped"
          else
            echo "No backend PID file found"
          fi

      - name: Build frontend
        run: npm run build


      - name: Upload client test report
        uses: actions/upload-artifact@v4
        with:
          name: test-report-client
          path: client/test-report.html

